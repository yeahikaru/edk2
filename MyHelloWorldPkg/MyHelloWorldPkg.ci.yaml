##
# CI Configuration for MyHelloWorldPkg
##
{
    "PrEval": {
        "DscPath": "MyHelloWorld.dsc",
    },
    "Pragmas": {
        "ProjectMu": "Ignore"
    },
    "AcceptableTests": [
        "SpellCheck",
        "GuidCheck",
        "LicenseCheck"
    ],
    "CompilerPlugin": {
        "DscPath": "MyHelloWorld.dsc"
    },
    "DscCompleteCheck": {
        "DscPath": "MyHelloWorld.dsc"
    },
    "SpellCheck": {
        "ExtendWords": [
            "edidexam",
            "pcioioexam",
            "smbiosexam",
            "smbusexam",
            "indentifier) fix: (identifier"
        ]
    },
    "UncrustifyCheck": {
        "AuditOnly": false,
        "IgnoreFiles": [
            "MyHelloWorld/MyHelloWorld.c"
        ]
    }
}